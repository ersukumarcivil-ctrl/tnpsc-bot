name: TNPSC Bot Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # ஒவ்வொரு 5 நிமிடத்திற்கு ஒருமுறை இயங்கும்
  workflow_dispatch: # மேனுவலாக செக் செய்ய

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
